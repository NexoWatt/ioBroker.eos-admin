name: Unified EOS verification
on:
  push:
    branches: [main, master]
  pull_request: {}
  workflow_dispatch: {}
  workflow_call: {}
permissions:
  contents: read
concurrency:
  group: eos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['22.23.4', '24.22.3']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Verify unchanged delivery
        run: node tools/eos-release-check.cjs
      - name: Install locked build dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix src-admin ci --ignore-scripts --no-audit --no-fund
          npm --prefix ui/src-admin-tab ci --ignore-scripts --no-audit --no-fund
      - name: Compile and verify
        run: |
          npm run build:unified-backend
          npm run build:ui-runtime
          npm run build:modules
          npm run typecheck
          npm run lint:unified
          npm test
      - name: Build both frontend sources
        run: |
          npm run build:frontend
          npm run build:installer
      - name: Dependency advisories
        run: npm audit --omit=dev --audit-level=moderate
# No automatic publishing, signing, merging or production approval.
